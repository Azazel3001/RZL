<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>LZR PRO</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- LOGO ANIMADO -->
  <div id="logo-container">
    <img src="/logo.png" id="logo" alt="LZR">
  </div>

  <!-- LOGIN -->
  <div id="login" class="panel">
    <h2>Bienvenido a LZR PRO</h2>
    <input id="userInput" placeholder="Usuario">
    <input id="passInput" type="password" placeholder="Contraseña">
    <button onclick="login()">Entrar al sistema</button>
  </div>

  <!-- APP -->
  <div id="app" style="display:none" class="panel">

    <div class="top-bar">
      <button onclick="openSupport()" class="support-btn">Soporte</button>
      <span id="roleTag"></span>
      <button onclick="logout()">Salir</button>
      <div id="alerts" class="alerts">✅ Todo en orden</div>
    </div>

    <!-- INVENTARIO -->
    <div class="inventory">
      <h2>Inventario</h2>

      <div class="form">
        <input id="name" placeholder="Producto">
        <input id="price" placeholder="Precio">
        <input id="stock" placeholder="Stock">
        <input id="img" placeholder="URL Imagen">
        <button onclick="addProduct()">Agregar</button>
        <input id="search" placeholder="Buscar..." oninput="render()">
      </div>

      <div id="products" class="grid"></div>
    </div>

    <!-- MODAL SOPORTE -->
    <div id="supportModal" class="modal">
      <div class="modal-box">
        <h3>Soporte LZR</h3>
        <p>📧 soporte@lzr.com</p>
        <p>📱 WhatsApp: +52 000 000 0000</p>
        <button onclick="closeSupport()">Cerrar</button>
      </div>
    </div>

  </div>

  <script src="/main.js"></script>
</body>

</html>
