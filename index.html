<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>LZR PRO</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="container">

    <!-- IZQUIERDA (FONDO + LZR) -->
    <div class="left">

      <div class="code">
        function develop() {
        const system = new LZR();
        system.build();
        system.success();
        }
      </div>

      <h1 class="logo">LZR</h1>
      <p class="sub">SISTEMA PRO</p>

    </div>

    <!-- LOGIN -->
    <div class="right">

      <div class="login-box">

        <h2>Bienvenido</h2>
        <p>Inicia sesión para continuar</p>

        <input id="userInput" placeholder="Usuario">
        <input id="passInput" type="password" placeholder="Contraseña">

        <button onclick="login()">Entrar al sistema</button>

        <div class="support">
          <p>¿Necesitas ayuda?</p>
          <button class="support-btn">Soporte</button>
        </div>

      </div>

    </div>

  </div>

  <script src="/main.js"></script>

</body>

</html>
