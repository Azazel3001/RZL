<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>LZR PRO</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="container">

    <!-- IZQUIERDA -->
    <div class="left">
      <div class="code">
        function develop() {
        const system = new LZR();
        system.build();
        system.success();
        }
      </div>

      <h1 class="logo">LZR</h1>
      <p class="sub">SISTEMA PRO</p>
    </div>

    <!-- DERECHA -->
    <div class="right">
      <div class="login-box">
        <h2>Bienvenido</h2>
        <p>Inicia sesión para continuar</p>

        <input id="userInput" placeholder="Usuario">
        <input id="passInput" type="password" placeholder="Contraseña">

        <button onclick="login()">Entrar</button>
      </div>
    </div>

  </div>

  <!-- APP (OCULTO) -->
  <div id="app" style="display:none">

    <div class="navbar">
      <h2>LZR PANEL</h2>
      <button onclick="logout()">Salir</button>
    </div>

    <!-- INVENTARIO -->
    <div class="inventory">

      <h2>Inventario</h2>

      <div class="form">
        <input id="name" placeholder="Producto">
        <input id="price" placeholder="Precio">
        <input id="stock" placeholder="Stock">
        <input id="img" placeholder="URL Imagen">
        <button onclick="addProduct()">Agregar</button>
      </div>

      <div id="products" class="grid"></div>

    </div>

  </div>

  <script src="/main.js"></script>

</body>

</html>
