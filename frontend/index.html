<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>LZR PRO</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <!-- LOGIN -->
  <div id="login">
    <div class="left">
      <h1>LZR</h1>
      <p>Sistema Pro</p>
    </div>

    <div class="right">
      <h2>Bienvenido</h2>
      <input id="userInput" placeholder="Usuario">
      <input id="passInput" type="password" placeholder="Contraseña">
      <button onclick="login()">Entrar</button>
    </div>
  </div>

  <!-- APP -->
  <div id="app" style="display:none">

    <div class="navbar">
      <h2>LZR PANEL</h2>
      <div>
        <span id="roleTag"></span>
        <button onclick="logout()">Salir</button>
      </div>
    </div>

    <div class="card">
      <h3>Bienvenido al sistema</h3>
      <p>Ya estás dentro 🚀</p>
    </div>

  </div>

  <script src="/main.js"></script>
</body>

</html>
