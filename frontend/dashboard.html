<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="dashboard">

        <aside class="sidebar">
            <img src="logo.png" class="logo">
            <a class="active">Producción</a>
            <a>Inventario</a>
        </aside>

        <main class="main">

            <h2>Producción</h2>

            <!-- FLOW -->
            <div class="flow">
                <div class="card done">
                    <h3>Diseño</h3>
                </div>
                <div class="card progress">
                    <h3>Confección</h3>
                </div>
                <div class="card pending">
                    <h3>Entrega</h3>
                </div>
            </div>

            <!-- CRUD -->
            <h2>Productos</h2>

            <input id="name" placeholder="Nombre">
            <input id="quantity" placeholder="Cantidad">
            <input id="status" placeholder="Estado">
            <button onclick="addProduct()">Agregar</button>

            <div id="products"></div>

        </main>
    </div>

    <script src="main.js"></script>
</body>

</html>
